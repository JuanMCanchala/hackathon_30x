<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Radar 30X: sensor</title>
    <style>
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: #0c2730;
        max-width: 420px;
        margin: 32px auto;
        padding: 0 16px;
      }
      label {
        display: grid;
        gap: 4px;
        margin-bottom: 14px;
        font-weight: 600;
      }
      input {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid #c5d4d5;
        border-radius: 10px;
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 8px 16px;
        border: 0;
        border-radius: 999px;
        background: #ff6b2c;
        color: #0c2730;
        cursor: pointer;
      }
      p {
        color: #44606a;
      }
    </style>
  </head>
  <body>
    <h1>Radar 30X: sensor</h1>
    <p>Dónde está el radar y con qué nombre firmas lo que mandas.</p>
    <label>Dirección del radar <input id="base" placeholder="http://localhost:3300" /></label>
    <label>Tu nombre <input id="name" placeholder="Equipo 30X" /></label>
    <button id="save" type="button">Guardar</button>
    <span id="saved" hidden>Guardado.</span>
    <script src="options.js"></script>
  </body>
</html>
