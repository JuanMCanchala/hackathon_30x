<!-- Narration p06 15.02–17.03 «Esto es OndAI, tu AI trend analyst.» Rules: svg-path-draw (the
     wave), spring-pop-entrance (the plane), gradient-text-sweep shimmer (the wordmark). -->
<!-- sfx [{"t":0.0,"type":"impact-soft"},{"t":0.05,"type":"shimmer"},{"t":3.38,"type":"whoosh-long"}] -->
<style>
  #f02-glow { left: 560px; top: 160px; width: 800px; height: 760px; background: radial-gradient(circle, rgba(255, 79, 0, 0.45), rgba(255, 79, 0, 0) 65%); }
  #f02-glow2 { left: 900px; top: 330px; width: 700px; height: 600px; background: radial-gradient(circle, rgba(193, 183, 255, 0.3), rgba(193, 183, 255, 0) 65%); }
  #f02-wave { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #f02-lock { position: absolute; left: 0; right: 0; top: 330px; display: flex; flex-direction: column; align-items: center; }
  #f02-mark { display: flex; align-items: center; gap: 44px; }
  #f02-plane { width: 190px; height: 146px; }
  #f02-word { font-size: 236px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; display: flex; }
  #f02-word span { display: inline-block; color: transparent; background-image: linear-gradient(100deg, #fffdf9 0%, #fffdf9 40%, #ffd9c4 47%, #ffffff 50%, #d9d2ff 53%, #fffdf9 60%, #fffdf9 100%); background-size: 400% 100%; background-position: 100% 50%; -webkit-background-clip: text; background-clip: text; }
  #f02-tag { margin-top: 34px; font-size: 64px; font-weight: 300; letter-spacing: -0.03em; color: #fffdf9; }
  #f02-tag b { font-weight: 700; }
  #f02-eyebrow { position: absolute; left: 0; right: 0; top: 270px; text-align: center; color: var(--ink2d); }
</style>
<div class="k-stage" id="f02-stage">
  <div class="k-glow" id="f02-glow"></div>
  <div class="k-glow" id="f02-glow2"></div>
  <svg id="f02-wave" viewBox="0 0 1920 1080" aria-hidden="true">
    <path id="f02-wave-path" data-layout-allow-overflow d="M -80 880 C 260 740, 460 1010, 760 880 S 1240 740, 1500 850 S 1880 960, 2020 830" fill="none" stroke="#ff4f00" stroke-width="22" stroke-linecap="round" />
  </svg>
  <div id="f02-lock">
    <div id="f02-mark">
      <div id="f02-plane"></div>
      <div id="f02-word"><span>O</span><span>n</span><span>d</span><span>A</span><span>I</span></div>
    </div>
    <div id="f02-tag">tu <b class="k-grad" id="f02-grad">AI trend analyst</b></div>
  </div>
  <div id="f02-eyebrow" class="k-eyebrow">Hackathon 30X · Radar de contenido</div>
</div>
<script>
  $('#f02-plane').innerHTML = K.plane(190);
  const path = $('#f02-wave-path');
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;

  // The wave crosses the frame as the name lands (svg-path-draw).
  tl.fromTo(path, { strokeDashoffset: len, opacity: 1 }, { strokeDashoffset: 0, duration: 1.1, ease: 'power3.inOut' }, 0);
  tl.fromTo('#f02-glow', { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: 'expo.out' }, 0);
  tl.fromTo('#f02-glow2', { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.6, ease: 'expo.out' }, 0.3);
  // The plane arrives with a light overshoot (spring-pop-entrance).
  tl.fromTo('#f02-plane', { x: -260, y: 140, rotation: -28, scale: 0.4, opacity: 0 }, { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.9, ease: 'back.out(1.5)' }, 0.08);
  tl.fromTo('#f02-word span', { y: 120, opacity: 0, filter: 'blur(18px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.8, ease: 'expo.out', stagger: 0.06 }, 0.2);
  // The shimmer: a bright band travels once through the letters.
  tl.fromTo('#f02-word span', { backgroundPosition: '100% 50%' }, { backgroundPosition: '0% 50%', duration: 1.3, ease: 'power2.inOut' }, 0.95);
  tl.fromTo('#f02-tag', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: 'power4.out' }, 1.0);
  K.sweep(tl, '#f02-grad', 1.0, 2.6);
  tl.fromTo('#f02-eyebrow', { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'power2.out' }, 1.5);
  // Hold with a slow push, then fly through the name into the product.
  tl.fromTo('#f02-lock', { scale: 1 }, { scale: 1.05, duration: 2.4, ease: 'sine.inOut' }, 1.0);
  K.drift(tl, '#f02-glow', { x: 40, y: -20, scale: 1.08, period: 1.4, total: 2.8, at: 1.2 });
  tl.to('#f02-lock', { scale: 1.9, opacity: 0, filter: 'blur(22px)', duration: 0.6, ease: 'power3.in' }, 3.4);
  tl.to(['#f02-wave', '#f02-eyebrow', '#f02-glow2'], { opacity: 0, duration: 0.45, ease: 'power2.in' }, 3.45);
</script>
