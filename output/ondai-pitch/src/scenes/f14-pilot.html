<style>
  #f14-glow { left: 60px; top: 300px; width: 1100px; height: 780px; background: radial-gradient(ellipse, rgba(193, 183, 255, 0.2), rgba(193, 183, 255, 0) 65%); }
  #f14-glow2 { left: 1080px; top: 280px; width: 900px; height: 700px; background: radial-gradient(ellipse, rgba(255, 79, 0, 0.3), rgba(255, 79, 0, 0) 65%); }
  #f14-head { position: absolute; left: 160px; top: 110px; }
  #f14-title { margin-top: 18px; font-size: 84px; line-height: 1; display: flex; gap: 0.26em; white-space: nowrap; }
  #f14-title .k-light { color: var(--cream); }
  #f14-who { margin-top: 18px; display: flex; align-items: center; gap: 16px; font-size: 36px; font-weight: 500; color: var(--ink2d); letter-spacing: -0.015em; }
  #f14-who b { color: var(--cream); font-weight: 700; }

  #f14-board { position: absolute; left: 160px; top: 400px; width: 900px; height: 560px; }
  .f14-week { position: absolute; top: 0; width: 186px; height: 560px; }
  .f14-wk { position: absolute; left: 0; top: 0; width: 186px; display: flex; align-items: center; justify-content: space-between; }
  .f14-wk span { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; letter-spacing: 0.12em; color: var(--ink2d); text-transform: uppercase; }
  .f14-ok { width: 34px; height: 34px; border-radius: 50%; background: var(--marker); display: flex; align-items: center; justify-content: center; }
  .f14-cell { position: absolute; left: 0; width: 186px; height: 70px; box-sizing: border-box; border-radius: 14px; border: 2px solid rgba(193, 183, 255, 0.4); background: rgba(193, 183, 255, 0.06); display: flex; align-items: center; padding: 0 18px; gap: 12px; }
  .f14-cell span { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; color: var(--ink2d); letter-spacing: 0.06em; }
  .f14-fill { position: absolute; inset: -2px; border-radius: 14px; background: var(--marker); display: flex; align-items: center; padding: 0 18px; gap: 12px; transform-origin: 0 50%; }
  .f14-fill span { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: #201515; letter-spacing: 0.06em; }
  #f14-line { position: absolute; left: -24px; width: 948px; height: 0; border-top: 4px dashed var(--cream); transform-origin: 0 50%; }
  #f14-line-tag { position: absolute; left: 0; top: 0; padding: 8px 18px; border-radius: 999px; background: var(--cream); color: #201515; font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; letter-spacing: 0.08em; white-space: nowrap; }
  #f14-foot { position: absolute; left: 160px; top: 990px; font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: var(--ink2d); text-transform: uppercase; }

  #f14-side { position: absolute; left: 1170px; top: 400px; width: 680px; }
  #f14-legend { display: flex; align-items: center; gap: 18px; font-size: 32px; font-weight: 500; color: var(--ink2d); letter-spacing: -0.01em; }
  #f14-legend i { flex: none; width: 44px; height: 30px; border-radius: 8px; border: 2px solid rgba(193, 183, 255, 0.55); background: rgba(193, 183, 255, 0.08); }
  #f14-crit { margin-top: 56px; }
  #f14-crit-pill { display: inline-flex; padding: 10px 22px; border-radius: 999px; border: 2px solid var(--lavender); color: var(--lavender); font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  #f14-big { margin-top: 20px; display: flex; align-items: baseline; gap: 22px; white-space: nowrap; }
  #f14-big b { font-size: 150px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.95; color: var(--cream); }
  #f14-big span { font-size: 40px; font-weight: 300; color: var(--cream); letter-spacing: -0.02em; }
  #f14-crit-sub { margin-top: 8px; font-size: 32px; font-weight: 500; color: var(--ink2d); letter-spacing: -0.01em; }
  #f14-stay { margin-top: 56px; font-size: 88px; line-height: 1; white-space: nowrap; }
</style>
<div class="k-stage" id="f14-stage">
  <div class="k-glow" id="f14-glow"></div>
  <div class="k-glow" id="f14-glow2"></div>

  <div id="f14-head">
    <div class="k-eyebrow" id="f14-eyebrow">Propuesta · Piloto</div>
    <div id="f14-title" class="k-display"><span class="f14-tw">Piloto</span><span class="f14-tw k-light">de</span><span class="f14-tw">1 mes</span></div>
    <div id="f14-who"><span>OndAI × </span><b>equipo de medios 30X</b></div>
  </div>

  <div id="f14-board"></div>
  <div id="f14-foot">Ilustra el criterio · no son resultados</div>

  <div id="f14-side">
    <div id="f14-legend"><i></i>5 temas propuestos por semana</div>
    <div id="f14-crit">
      <div id="f14-crit-pill">Criterio de éxito</div>
      <div id="f14-big"><b>≥ 2 de 5</b></div>
      <div id="f14-crit-sub">temas producidos, cada semana</div>
    </div>
    <div id="f14-stay" class="k-display">OndAI <span class="k-grad" id="f14-grad">se queda.</span></div>
  </div>
</div>
<script>
  // The board: 4 weeks × 5 cells stacked bottom-up from the baseline, threshold between cell 2 and 3.
  const COLX = [0, 238, 476, 714];
  const CELL = 70, GAP = 14, BASE = 560;
  const EXTRA = 34; // the threshold gap between cell 2 and 3 is wider, the line lives in it
  const cellTop = (i) => BASE - (i + 1) * CELL - i * GAP - (i >= 2 ? EXTRA : 0); // i = 0 is the bottom cell
  const check = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="#201515" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let html = '';
  COLX.forEach((x, w) => {
    html += `<div class="f14-week" id="f14-w${w}" style="left:${x}px">`;
    html += `<div class="f14-wk" id="f14-wk${w}" style="top:${cellTop(4) - 64}px"><span>Semana ${w + 1}</span><div class="f14-ok" id="f14-ok${w}">${check}</div></div>`;
    for (let i = 0; i < 5; i++) {
      const fill = i < 2 ? `<div class="f14-fill" id="f14-f${w}-${i}">${check}<span>Producido</span></div>` : '';
      html += `<div class="f14-cell f14-c${w}" data-layout-allow-overlap id="f14-c${w}-${i}" style="top:${cellTop(i)}px"><span>Tema ${i + 1}</span>${fill}</div>`;
    }
    html += '</div>';
  });
  const lineY = cellTop(1) - (GAP + EXTRA) / 2 - 2;
  html += `<div id="f14-line" style="top:${lineY}px"></div><div id="f14-line-tag" style="left:${900 - 300}px;top:${lineY - 20}px">≥ 2 de 5 producidos</div>`;
  $('#f14-board').innerHTML = html;

  K.enter(tl, '#f14-stage', 0);
  tl.fromTo('#f14-glow', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.6, ease: 'expo.out' }, 0);
  tl.fromTo('#f14-glow2', { opacity: 0 }, { opacity: 1, duration: 2, ease: 'power2.out' }, 0.5);
  K.drift(tl, '#f14-glow', { x: 40, y: -20, scale: 1.06, period: 3.4, total: 13.6 });
  K.drift(tl, '#f14-glow2', { x: -50, y: 30, period: 4.5, total: 13.5 });

  // «Proponemos un piloto de un mes» — the title waterfalls in (binary opacity, rise from below).
  tl.fromTo('#f14-eyebrow', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 0.15);
  $$('.f14-tw').forEach((el, i) => {
    tl.set(el, { opacity: 0 }, 0);
    tl.set(el, { opacity: 1 }, 0.3 + i * 0.14);
    tl.fromTo(el, { y: 70 }, { y: 0, duration: 0.42, ease: 'power4.out' }, 0.3 + i * 0.14);
  });
  // «con el equipo de medios de 30X»
  tl.fromTo('#f14-who', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 2.2);

  // The board cascades in, week by week, bottom cell first.
  for (let w = 0; w < 4; w++) {
    tl.fromTo('#f14-wk' + w, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 1.0 + w * 0.16);
    tl.set('#f14-ok' + w, { scale: 0, opacity: 0 }, 0);
    for (let i = 0; i < 5; i++) {
      const at = 1.1 + w * 0.16 + i * 0.07;
      tl.set('#f14-c' + w + '-' + i, { opacity: 0 }, 0);
      tl.set('#f14-c' + w + '-' + i, { opacity: 1 }, at);
      tl.fromTo('#f14-c' + w + '-' + i, { y: 46 }, { y: 0, duration: 0.4, ease: 'power4.out' }, at);
      if (i < 2) tl.set('#f14-f' + w + '-' + i, { scaleX: 0, opacity: 0 }, 0);
    }
  }
  tl.set(['#f14-line-tag', '#f14-crit', '#f14-stay'], { opacity: 0 }, 0);
  tl.set('#f14-line', { scaleX: 0, opacity: 0 }, 0);
  tl.fromTo('#f14-legend', { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.7, ease: 'power3.out' }, 2.6);
  tl.fromTo('#f14-foot', { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'power2.out' }, 3.0);

  // Music gap: the board breathes in slowly.
  tl.fromTo('#f14-board', { scale: 1 }, { scale: 1.03, duration: 3.3, ease: 'sine.inOut', transformOrigin: '50% 100%' }, 3.8);

  // «Si al menos dos de los cinco temas» — the threshold line draws across all four weeks.
  tl.set('#f14-line', { opacity: 1 }, 7.45);
  tl.to('#f14-line', { scaleX: 1, duration: 0.8, ease: 'power3.inOut' }, 7.45);
  tl.fromTo('#f14-line-tag', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'power3.out', transformOrigin: '50% 100%' }, 8.2);
  tl.fromTo('#f14-crit', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: 'expo.out' }, 8.3);
  tl.to('#f14-legend', { opacity: 0.55, duration: 0.6 }, 8.3);

  // «de cada semana se producen» — two cells per week fill, the week gets its check.
  for (let w = 0; w < 4; w++) {
    const at = 8.75 + w * 0.3;
    tl.to('#f14-f' + w + '-0', { scaleX: 1, opacity: 1, duration: 0.3, ease: 'power3.out' }, at);
    tl.to('#f14-f' + w + '-1', { scaleX: 1, opacity: 1, duration: 0.3, ease: 'power3.out' }, at + 0.1);
    tl.to('#f14-ok' + w, { scale: 1, opacity: 1, duration: 0.4, ease: 'power3.out' }, at + 0.2);
  }

  // «OndAI se queda» lands.
  tl.fromTo('#f14-stay', { opacity: 0, y: 50, filter: 'blur(12px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'expo.out' }, 10.55);
  K.sweep(tl, '#f14-grad', 10.6, 2.9);
  tl.fromTo('#f14-side', { scale: 1 }, { scale: 1.04, duration: 2.8, ease: 'power2.out', transformOrigin: '0% 70%' }, 10.6);

  K.exit(tl, '#f14-stage', 13.5);
</script>
