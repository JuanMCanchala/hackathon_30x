      <path id="f16-wave-path" d="M -260 990 C 80 900, 300 1050, 600 975 S 1080 880, 1360 950 S 1860 1010, 2200 900" fill="none" stroke="#ff4f00" stroke-width="20" stroke-linecap="round" />
    </g>

<script>
  $('#f16-plane').innerHTML = K.plane(124);
  const path = $('#f16-wave-path');
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;

  // The final hit: the mark and the glow bloom together.
  tl.fromTo('#f16-glow', { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.4, ease: 'expo.out' }, 0.1);
  tl.fromTo('#f16-glow2', { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.8, ease: 'expo.out' }, 0.3);
  tl.fromTo('#f16-plane', { x: -180, y: 90, rotation: -24, scale: 0.4, opacity: 0 }, { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.9, ease: 'power3.out' }, 0.1);
  tl.fromTo('#f16-word span', { y: 90, opacity: 0, filter: 'blur(16px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.75, ease: 'expo.out', stagger: 0.05 }, 0.14);
  tl.fromTo('#f16-word span', { backgroundPosition: '100% 50%' }, { backgroundPosition: '0% 50%', duration: 1.3, ease: 'power2.inOut' }, 0.8);

  // The wave draws in from the left, then keeps advancing gently into the future (right).
  tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.6, ease: 'power3.inOut' }, 0.1);
  tl.fromTo('#f16-wave-g', { x: -40 }, { x: 160, duration: 7.9, ease: 'none' }, 0.1);

  // «Tu equipo, siempre» · «un paso adelante.»
  tl.fromTo('#f16-line1', { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 0.3);
  tl.fromTo('#f16-line2', { opacity: 0, y: 60, filter: 'blur(14px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.8, ease: 'expo.out' }, 1.15);
  K.sweep(tl, '#f16-grad', 1.15, 5.6, 2);

  // The discreet CTA, then «¿Empezamos?».
  tl.fromTo('#f16-cta', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 2.2);
  tl.fromTo('#f16-ask', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 2.9);

  // Logo holds with a slow settle; everything fades to black, ending fully black at 8.0.
  tl.fromTo('#f16-lock', { scale: 1 }, { scale: 1.035, duration: 6.7, ease: 'sine.inOut' }, 0.8);
  K.drift(tl, '#f16-glow', { x: 30, y: -16, scale: 1.06, period: 3.2, total: 6.4, at: 1.4 });
  tl.fromTo('#f16-black', { opacity: 0 }, { opacity: 1, duration: 1.2, ease: 'power1.inOut' }, 6.8);
</script>
