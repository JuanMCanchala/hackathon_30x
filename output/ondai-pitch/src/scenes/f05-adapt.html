<script>
  const view = { w: 1596, h: 896 };
  const s = 1600 / 1440; // display px per captured CSS px
  $('#f05-cursor').innerHTML = K.cursorSvg;
  const cams = ['#f05-cam', '#f05-ovcam'];

  // Camera: both the clipped capture and the overlay (callouts) ride the same transform.
  const camAt = (cx, cy, z) => K.frame(view, s, cx, cy, z);
  const c0 = camAt(720, 405, 1);
  tl.set(cams, { x: c0.x, y: c0.y, scale: 1 }, 0);
  const move = (cx, cy, z, at, duration, ease) => {
    const f = camAt(cx, cy, z);
    tl.to(cams, { x: f.x, y: f.y, scale: f.scale, duration, ease }, at);
  };

  // Callout geometry, CSS px of the 1440 × 810 recording (cam px = CSS × s).
  const B = {
    ang: { x: 370, y: 184, w: 980, h: 94 }, // «Ángulo · variante 1» + the angle
    gan: { x: 378, y: 309, w: 328, h: 78 }, // the chosen hook
    bor: { x: 296, y: 472, w: 590, h: 286 }, // «Vista previa · LinkedIn»
    voz: { x: 511, y: 112, w: 192, h: 42 }, // «en la voz de 30X» in the page title
  };
  // Static layout, written once at build time (cam px = CSS × s).
  const put = (sel, x, y, w, h) => {
    const el = $(sel);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    if (w != null) { el.style.width = w + 'px'; el.style.height = h + 'px'; }
  };
  const box = (sel, b, pad) => put(sel, (b.x - pad) * s, (b.y - pad) * s, (b.w + 2 * pad) * s, (b.h + 2 * pad) * s);
  for (const k of Object.keys(B)) {
    box('#f05-spot-' + k, B[k], 4);
    box('#f05-lock-' + k, B[k], 6);
  }
  // Tags straddle the top edge of their block, flush right (the genre's label); «voz» sits beside
  // the title words it names.
  for (const k of ['ang', 'gan', 'bor']) put('#f05-tagw-' + k, (B[k].x + B[k].w + 6) * s, (B[k].y - 6) * s);
  put('#f05-tagw-voz', (B.voz.x + B.voz.w + 14) * s, (B.voz.y + B.voz.h / 2) * s + 2);
  put('#f05-notew', (B.gan.x - 4) * s, (B.gan.y + B.gan.h + 16) * s);

  K.drift(tl, '#f05-glow', { x: 40, y: -20, scale: 1.08, period: 3, total: 6, at: 1.4 }); // back at rest by 7.4

  // Its first move (media 1.20–2.10) straddles the clip start: finish it from where it is at 0.
  tl.fromTo('#f05-cursor', { x: 725 * s, y: 402 * s }, { x: 1000 * s, y: 250 * s, duration: 0.8, ease: 'power2.inOut', immediateRender: false }, 0.01);

  // One push for the sentence: ángulo, gancho and borrador framed together.
  move(850, 440, 1.22, 1.1, 1.4, 'expo.out');

  // Each block locks on as the voice names it; the previous lock lets go.
  const lock = (k, at) => {
    tl.fromTo('#f05-spot-' + k, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power2.out' }, at - 0.05);
    tl.fromTo('#f05-lock-' + k, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(2)', transformOrigin: '50% 50%' }, at);
    tl.fromTo('#f05-tag-' + k, { opacity: 0, y: 14, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(2.2)', transformOrigin: k === 'voz' ? '0% 50%' : '100% 50%' }, at + 0.08);
  };
  const release = (k, at) => {
    tl.to('#f05-spot-' + k, { opacity: 0, duration: 0.3, ease: 'power2.inOut' }, at);
    tl.to('#f05-lock-' + k, { opacity: 0, duration: 0.3, ease: 'power2.in' }, at);
    tl.to('#f05-tag-' + k, { opacity: 0.82, duration: 0.3, ease: 'power2.out' }, at);
  };
  lock('ang', 1.3);
  release('ang', 2.15);

  release('gan', 2.77);
