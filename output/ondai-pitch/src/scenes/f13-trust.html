<script>
  // Row slots (x of each 560 px card) and the centered "one message" pose.
  const SLOT = [80, 680, 1280];
  const FOCUS = { x: 680, scale: 1.42 };
  const cards = ['#f13-c1', '#f13-c2', '#f13-c3'];

  K.enter(tl, '#f13-stage', 0);
  tl.fromTo('#f13-glow', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.4, ease: 'expo.out' }, 0);
  tl.fromTo('#f13-glow2', { opacity: 0 }, { opacity: 1, duration: 2, ease: 'power2.out' }, 0.4);
  K.drift(tl, '#f13-glow', { x: 50, y: -24, scale: 1.08, period: 3.6, total: 14.4 });
  K.drift(tl, '#f13-glow2', { x: -60, y: 20, period: 4.8, total: 14.4 });

  tl.set(['#f13-c2', '#f13-c3'], { x: FOCUS.x, scale: FOCUS.scale, opacity: 0 }, 0);

  // A message arrives from the right into the center; the previous one leaves to the left.
  const arrive = (sel, at) => tl.fromTo(sel, { x: FOCUS.x + 520, opacity: 0, filter: 'blur(16px)' }, { x: FOCUS.x, opacity: 1, filter: 'blur(0px)', duration: 0.75, ease: 'expo.out' }, at);
  const leave = (sel, at) => tl.to(sel, { x: FOCUS.x - 640, opacity: 0, filter: 'blur(16px)', duration: 0.45, ease: 'power3.in' }, at);
  const rise = (sel, at, y = 30) => tl.fromTo(sel, { y, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, at);

  // 1 · «Solo usa contenido público, sin iniciar sesión.»
  tl.fromTo('#f13-c1', { x: FOCUS.x, y: 0, scale: FOCUS.scale, opacity: 1, filter: 'blur(0px)' }, { x: FOCUS.x, duration: 0.01 }, 0);
  rise('#f13-c1 .f13-eye', 0.15, 20);
  rise('#f13-h1', 0.25, 40);
  rise('#f13-li1', 1.85, 24);
  rise('#f13-li2', 2.1, 24);
  leave('#f13-c1', 3.5);

  // 2 · «Cuesta entre cuarenta y cuarenta y cinco dólares al mes.»
  arrive('#f13-c2', 3.75);
  rise('#f13-usd', 3.95, 20);
  rise('#f13-price', 4.0, 30);
  K.count(tl, $('#f13-n1'), { from: 0, to: 40, start: 4.15, duration: 1.0 });
  K.count(tl, $('#f13-n2'), { from: 0, to: 45, start: 4.35, duration: 1.0 });
  K.sweep(tl, '#f13-num', 4.0, 3.4);
  rise('#f13-note1', 5.55, 20);
  rise('#f13-note2', 5.8, 20);
  leave('#f13-c2', 7.3);

  // 3 · «Y una persona aprueba cada pieza.»
  arrive('#f13-c3', 7.55);
  rise('#f13-c3 .f13-eye', 7.65, 20);
  rise('#f13-h3', 7.7, 40);
  const pop = (sel, at) => tl.fromTo(sel, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'power3.out', transformOrigin: '0% 50%' }, at);
  pop('#f13-s1', 7.9);
  tl.fromTo('#f13-a1', { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power2.out' }, 8.2);
  pop('#f13-s2', 8.4);
  tl.fromTo('#f13-a2', { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power2.out' }, 8.8);
  pop('#f13-s3', 9.0);

  // Music: the three settle together as a calm row (the second voice keeps its gradient alive).
  tl.to('#f13-c3', { x: SLOT[2], scale: 1, duration: 1.1, ease: 'power3.inOut' }, 9.95);
  tl.fromTo('#f13-c1', { x: SLOT[0], y: 90, scale: 1, opacity: 0, filter: 'blur(14px)' }, { x: SLOT[0], y: 0, scale: 1, opacity: 1, filter: 'blur(0px)', duration: 1.0, ease: 'power3.out', immediateRender: false }, 10.2);
  tl.fromTo('#f13-c2', { x: SLOT[1], y: 90, scale: 1, opacity: 0, filter: 'blur(14px)' }, { x: SLOT[1], y: 0, scale: 1, opacity: 1, filter: 'blur(0px)', duration: 1.0, ease: 'power3.out', immediateRender: false }, 10.7);
  K.sweep(tl, '#f13-num', 10.6, 3.8);
  tl.to(cards, { y: -10, duration: 2.8, ease: 'sine.inOut', stagger: 0.25 }, 11.7);

  K.exit(tl, '#f13-stage', 14.5);
</script>
