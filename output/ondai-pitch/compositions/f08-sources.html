    weeks += `<div class="f08-wk k-mono" style="left:${x}px">S${i + 1}</div>`;
    if (i > 0) weeks += `<div class="f08-div" style="left:${x - 1}px"></div>`;
    bars += `<div class="f08-bar" id="f08-bar${i + 1}" style="left:${x + 22}px;height:${v * PX}px"></div>`;
    bars += `<div class="f08-val k-mono" id="f08-val${i + 1}" style="left:${x}px;top:${i >= 3 && i <= 6 ? 616 : BASE - v * PX - (i === 7 ? 50 : 40)}px">${v}</div>`;
  });
  $('#f08-weeks').innerHTML = weeks;
  $('#f08-bars').innerHTML = bars;
  const barSel = SERIES.map((_, i) => '#f08-bar' + (i + 1));
  const valSel = SERIES.map((_, i) => '#f08-val' + (i + 1));

  // ---------- A · 0.1–4.5: twelve sources, two honest lanes, the 8-week timeline ----------
  tl.fromTo('#f08-glow', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.4, ease: 'expo.out' }, 0.05);
  tl.fromTo('#f08-glow2', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.6, ease: 'expo.out' }, 0.2);
  K.drift(tl, '#f08-glow', { x: -60, y: 30, scale: 1.1, period: 3.8, total: 11.4, at: 0.3 });

  tl.fromTo('#f08-head', { y: 40, opacity: 0, filter: 'blur(12px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.7, ease: 'expo.out' }, 0.55);
  tl.fromTo('.f08-lane', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out', stagger: 0.18 }, 0.5);

  // depth-scatter-assemble: each pill from its own golden-angle point in a depth cloud.
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const pills = $$('.f08-pill');
  pills.forEach((el, i) => {
    const a = i * GOLDEN;
    const dT = i / (pills.length - 1);
    tl.fromTo(
      el,
      { x: Math.cos(a) * 420, y: Math.sin(a) * 300, z: 380 - dT * 780, rotationX: Math.sin(a) * 60, rotationY: Math.cos(a) * 60, opacity: 0 },
      { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, opacity: 1, duration: 1.0, ease: 'power3.out' },
      0.3 + i * 0.06,
    );
  });
  tl.fromTo('.f08-lab', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power2.out', stagger: 0.3 }, 1.0);

  // «cada dos horas»: one reading every 2 h fills the 8 weeks.
  tl.fromTo('#f08-freq', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, 1.82);
  tl.fromTo('#f08-axis', { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: 'power3.inOut' }, 1.5);
  tl.fromTo('#f08-comb', { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: 'power2.inOut' }, 1.9);
  tl.fromTo('#f08-comb-lab', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 2.0);
  // «con ocho semanas de historia»
  tl.fromTo('#f08-hist', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, 2.75);
  tl.fromTo('.f08-wk', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out', stagger: 0.07 }, 2.75);
  tl.fromTo('.f08-div', { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.07 }, 2.8);
  // Only the growth lane wires into the timeline.
  $$('.f08-wire').forEach((p, i) => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    tl.fromTo(p, { strokeDashoffset: len, opacity: 0.9 }, { strokeDashoffset: 0, duration: 0.8, ease: 'power2.inOut' }, 3.0 + i * 0.08);
  });

  // The pipeline strip runs once; it stops on «medir».
  const steps = $$('.f08-step');
  tl.fromTo('#f08-pipe', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.4);
  steps.forEach((el, i) => {
    const t = 0.7 + i * 0.42;
    tl.fromTo(el, { color: '#c5c0b1', backgroundColor: 'rgba(255,79,0,0)' }, { color: '#fffdf9', backgroundColor: 'rgba(255,79,0,0.22)', duration: 0.18, ease: 'power2.out' }, t);
    if (el.id !== 'f08-medir') tl.to(el, { color: '#c5c0b1', backgroundColor: 'rgba(255,79,0,0)', duration: 0.3, ease: 'power2.in' }, t + 0.36);
  });
  tl.to('#f08-medir', { backgroundColor: '#ff4f00', color: '#201515', duration: 0.3, ease: 'power2.out' }, 3.7);

  // ---------- A → B · 4.4: the sources step aside, the timeline becomes the chart ----------
  tl.to(['#f08-src', '#f08-wires'], { x: -260, opacity: 0, filter: 'blur(14px)', duration: 0.5, ease: 'power3.in' }, 4.35);
  tl.to(['#f08-freq', '#f08-hist'], { y: -40, opacity: 0, filter: 'blur(10px)', duration: 0.45, ease: 'power3.in' }, 4.4);
  tl.to(['#f08-comb', '#f08-comb-lab', '#f08-pipe'], { opacity: 0, duration: 0.45, ease: 'power2.in' }, 4.4);

  // B · 4.8 «Cuando un tema crece»: the real weeks of «IA open source».
  tl.fromTo('#f08-ctitle', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 4.75);
  tl.fromTo(barSel.slice(0, 7), { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: 'power3.out', stagger: 0.06 }, 4.8);
  tl.fromTo(valSel.slice(0, 7), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out', stagger: 0.06 }, 5.0);
  tl.fromTo('#f08-bar8', { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: 'expo.out' }, 5.3);
  tl.fromTo('#f08-val8', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(2)' }, 5.55);

  // 5.4 «uno coma ocho»: the threshold slams in (riser ends here), one push-in for the sentence.
  tl.fromTo('#f08-thr-eb', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 5.2);
  tl.fromTo('#f08-big', { scale: 1.7, opacity: 0, filter: 'blur(24px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.6, ease: 'expo.out' }, 5.38);
  K.sweep(tl, '#f08-grad', 5.4, 6.0, 2);
  tl.fromTo('#f08-rule', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 5.95);
  tl.fromTo('#f08-cam', { scale: 1 }, { scale: 1.05, duration: 3.4, ease: 'power2.out' }, 5.4);

  // 6.6 «sobre su promedio»: the 4 previous weeks and their average.
  tl.to(barSel.slice(3, 7), { backgroundColor: 'rgba(193,183,255,0.5)', duration: 0.4, ease: 'power2.out', stagger: 0.05 }, 6.55);
  tl.fromTo('#f08-avg', { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'power3.inOut' }, 6.6);
  tl.fromTo('#f08-avg-lab', { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power3.out' }, 6.75);

  // 7.0: the lift, computed from those counts, crosses the 1,8× tick.
  tl.fromTo('#f08-calc', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 6.95);
  tl.fromTo(['#f08-meter', '#f08-tick', '#f08-tick-lab', '#f08-m0', '#f08-m4'], { opacity: 0 }, { opacity: 1, duration: 0.45, ease: 'power2.out' }, 7.0);
  K.count(tl, $('#f08-lift'), { from: 1, to: 3.56, start: 7.2, duration: 1.0, ease: 'power3.out', fmt: (v) => v.toFixed(2).replace('.', ',') + '×' });
  tl.fromTo('#f08-lift', { scale: 0.6 }, { scale: 1, duration: 1.0, ease: 'power3.out' }, 7.2);
  tl.fromTo('#f08-fill', { scaleX: 0 }, { scaleX: 3.56 / 4, duration: 1.0, ease: 'power3.out' }, 7.2);

  // 8.2 «hay señal»: this week's bar turns marker orange.
  tl.to('#f08-bar8', { backgroundColor: '#ff4f00', boxShadow: '0 0 60px rgba(255,79,0,0.7)', duration: 0.35, ease: 'power2.out' }, 8.18);
  tl.to('#f08-fill', { backgroundColor: '#ff4f00', duration: 0.35, ease: 'power2.out' }, 8.18);
  tl.to('#f08-lift', { color: '#ff5f17', duration: 0.35, ease: 'power2.out' }, 8.18);
  tl.fromTo('#f08-senal', { scale: 0.5, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: 'back.out(2.2)' }, 8.2);

  // Leave to the left.
  K.exit(tl, '#f08-cam', 11.5);
  tl.to(['#f08-glow', '#f08-glow2'], { opacity: 0, duration: 0.5, ease: 'power2.in' }, 11.5);

          window.__timelines['f08-sources'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
