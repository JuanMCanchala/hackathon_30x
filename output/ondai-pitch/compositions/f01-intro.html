  tl.to('#f01-clock', { y: -260, scale: 0.4, opacity: 0, filter: 'blur(8px)', duration: 0.36, ease: 'power3.in' }, 2.08);
  tl.fromTo('#f01-stamp', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 2.45);

  // ---- 2.36–6.3 · the week's viral pieces pile up in depth (depth-scatter-assemble).
  const cards = [
    { id: '#f01-c1', x: 120, y: 150, z: 0, rx: 6, ry: 14, rot: -4 },
    { id: '#f01-c2', x: 1330, y: 110, z: -60, rx: 5, ry: -14, rot: 4 },
    { id: '#f01-c3', x: 1320, y: 650, z: 40, rx: -6, ry: -12, rot: -3 },
    { id: '#f01-c4', x: 130, y: 690, z: -40, rx: -6, ry: 12, rot: 3 },
    { id: '#f01-c5', x: 725, y: 70, z: -320, rx: 8, ry: 0, rot: 2 },
    { id: '#f01-c6', x: 725, y: 790, z: -260, rx: -8, ry: 0, rot: -2 },

  cards.forEach((c, i) => {

    const at = 2.42 + i * 0.28;
    tl.fromTo(
      c.id,
      { x: c.x + Math.cos(a) * 420, y: c.y + Math.sin(a) * 300, z: -900, rotationX: Math.sin(a) * 40, rotationY: Math.cos(a) * 50, rotation: c.rot * 3, opacity: 0 },
      { x: c.x, y: c.y, z: c.z, rotationX: c.rx, rotationY: c.ry, rotation: c.rot, opacity: 1, duration: 0.9, ease: 'expo.out' },
      at,
    );
    // The pile keeps breathing toward us while it holds.
    tl.to(c.id, { z: c.z + 70, rotationY: c.ry * 0.7, duration: 6.33 - at - 0.9, ease: 'sine.inOut' }, at + 0.9);
  });
  tl.fromTo('#f01-deck', { rotationY: -6 }, { rotationY: 4, duration: 4.0, ease: 'sine.inOut' }, 2.36);
  tl.fromTo('#f01-glow-b', { opacity: 0 }, { opacity: 1, duration: 1.4, ease: 'power2.out' }, 2.4);

  $('#f01-pointer').innerHTML = K.cursorSvg;

    { x: 1560, y: 330, t: 4.35 },

  }

  // ---- 6.33 · «Pero nadie sabe por qué funcionó…» Everything freezes, desaturates, falls back.
  tl.to('#f01-cloud', { scale: 0.86, opacity: 0.16, filter: 'grayscale(1) blur(7px)', duration: 0.55, ease: 'power3.out' }, 6.33);
  tl.to('#f01-glow-b', { opacity: 0.25, duration: 0.6 }, 6.33);
  tl.fromTo('#f01-why', { scale: 1.8, opacity: 0, filter: 'blur(26px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.42, ease: 'power4.out' }, 6.86);
  K.sweep(tl, '#f01-why-word', 6.9, 1.9);
  tl.fromTo('#f01-why', { rotation: 0 }, { rotation: -1.2, duration: 0.08, yoyo: true, repeat: 3, ease: 'none' }, 6.95);
  tl.to('#f01-why', { scale: 1.06, duration: 1.45, ease: 'sine.inOut' }, 7.3);
  tl.to('#f01-why', { scale: 1.4, opacity: 0, filter: 'blur(20px)', duration: 0.35, ease: 'power3.in' }, 8.8);
  tl.to('#f01-cloud', { opacity: 0, duration: 0.4, ease: 'power2.in' }, 8.75);

  // ---- 9.1 · «…ni qué publicar esta semana.» A bare week with empty slots.
  tl.fromTo('#f01-q', { y: 50, opacity: 0, filter: 'blur(12px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.6, ease: 'expo.out' }, 9.08);
  tl.fromTo('.f01-slot', { y: 60, opacity: 0, rotationX: -40 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.6, ease: 'back.out(1.6)', stagger: 0.07 }, 9.3);
  tl.fromTo('#f01-week', { scale: 1 }, { scale: 1.04, duration: 2.6, ease: 'sine.inOut' }, 9.3);
  tl.to('#f01-week', { y: 120, opacity: 0, filter: 'blur(10px)', duration: 0.45, ease: 'power3.in' }, 11.75);
  tl.to('#f01-stamp', { opacity: 0, duration: 0.4 }, 11.8);

  // ---- 12.1 · «…la onda ya pasó.» The wave rises to its peak, then falls; the camera follows it down.
  const rise = $('#f01-rise');
  const fall = $('#f01-fall');
  const lr = rise.getTotalLength();
  const lf = fall.getTotalLength();
  // Gap longer than the path + offset past the end: no round-cap dot shows before the draw.
  rise.style.strokeDasharray = `${lr} ${lr + 200}`;
  fall.style.strokeDasharray = `${lf} ${lf + 200}`;
  tl.set(rise, { strokeDashoffset: lr + 60 }, 0);
  tl.set(fall, { strokeDashoffset: lf + 60 }, 0);
  tl.set(['#f01-label', '#f01-peakglow'], { opacity: 0 }, 0);
  tl.to(rise, { strokeDashoffset: 0, duration: 1.2, ease: 'power2.inOut' }, 12.1);
  tl.fromTo('#f01-dot', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(2.5)' }, 13.2);
  tl.fromTo('#f01-peakglow', { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: 'expo.out' }, 13.1);
  tl.fromTo('#f01-label', { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power3.out' }, 12.6);
  // «ya pasó»: the wave falls, the peak goes cold, the frame follows it down and clears.
  tl.to(fall, { strokeDashoffset: 0, duration: 1.0, ease: 'power2.in' }, 13.5);
  tl.to('#f01-dot', { backgroundColor: '#8a847c', boxShadow: '0 0 0 10px rgba(138,132,124,0.25), 0 0 0px rgba(0,0,0,0)', duration: 0.4 }, 13.5);
  tl.to(['#f01-label', '#f01-peakglow'], { opacity: 0, duration: 0.4 }, 13.55);
  tl.to('#f01-wavewrap', { y: -520, duration: 1.15, ease: 'power2.in' }, 13.55);
  tl.to('#f01-wavewrap', { opacity: 0, filter: 'blur(10px)', duration: 0.7, ease: 'power1.in' }, 13.95);
  tl.to('#f01-glow-a', { opacity: 0, duration: 0.8, ease: 'power2.in' }, 13.9);
  tl.to('#f01-glow-b', { opacity: 0, duration: 0.6 }, 13.9);
  // Clean dark frame from 14.7 so the reveal starts on darkness.
  tl.set('#f01-stage', { opacity: 0 }, 14.75);

          window.__timelines['f01-intro'] = tl;
        })();
