  // The screen whips out to the left; the schematic takes the frame.
  tl.to(['#f10-screen', '#f10-url'], { x: -320, opacity: 0, filter: 'blur(14px)', duration: 0.32, ease: 'power3.in' }, 3.82);

  // ── B · three waves, one time axis (a schematic, labeled as such) ──
  const BASE = 540;
  const wave = (cx, sg, A, x0 = 20, x1 = 1080) => {
    const pts = [];
    for (let x = x0; x <= x1; x += 10) pts.push([x, BASE - A * Math.exp(-((x - cx) * (x - cx)) / (2 * sg * sg))]);
    const line = 'M ' + pts.map((p) => p[0] + ' ' + p[1].toFixed(1)).join(' L ');
    return { line, area: line + ` L ${x1} ${BASE} L ${x0} ${BASE} Z`, y: (x) => BASE - A * Math.exp(-((x - cx) * (x - cx)) / (2 * sg * sg)) };
  };
  const W = { en: wave(330, 120, 400), pt: wave(520, 130, 270, 60), es: wave(800, 130, 350, 300) };
  const CX = 120, CY = 230; // chart origin on the canvas (1:1 scale)
  ['en', 'pt', 'es'].forEach((k) => {
    $('#f10-w-' + k).setAttribute('d', W[k].line);
    $('#f10-area-' + k).setAttribute('d', W[k].area);
  });
  $('#f10-dot-en').setAttribute('cy', W.en.y(156).toFixed(1));
  $('#f10-dot-es').setAttribute('cy', W.es.y(612).toFixed(1));

  tl.set(['#f10-head', '#f10-schema', '#f10-chart', '.f10-wlab', '#f10-axis', '#f10-win', '#f10-case', '#f10-kick', '#f10-note'], { opacity: 0 }, 0);
  tl.fromTo('#f10-head', { x: 260, opacity: 0, filter: 'blur(14px)' }, { x: 0, opacity: 1, filter: 'blur(0px)', duration: 0.7, ease: 'expo.out' }, 3.95);
  K.sweep(tl, '#f10-grad', 4.0, 2.9);
  tl.fromTo('#f10-schema', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 4.3);
  tl.set('#f10-chart', { opacity: 1 }, 3.95);
  tl.set(['#f10-band', '#f10-edge-a', '#f10-edge-b', '#f10-brk', '#f10-dot-en', '#f10-dot-es'], { opacity: 0 }, 0);
  tl.fromTo('#f10-base', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.95);
  tl.fromTo('#f10-axis', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 4.2);

  // svg-path-draw: English first, Portuguese next, Spanish late.
  const draw = (k, at, dur) => {
    const p = $('#f10-w-' + k);
    const len = p.getTotalLength();
    p.style.strokeDasharray = len + ' ' + (len + 60);
    tl.set(p, { opacity: 0 }, 0);
    tl.set(p, { opacity: 1 }, at);
    tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: 'power2.inOut' }, at);
    tl.fromTo('#f10-area-' + k, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, at + dur * 0.6);
  };
  draw('en', 4.0, 0.95);
  draw('pt', 4.3, 0.95);
  draw('es', 4.6, 1.0);
  const lab = (k, x, y, at) => {
    tl.set('#f10-lab-' + k, { x: CX + x, y: CY + y }, 0);
    tl.fromTo('#f10-lab-' + k, { opacity: 0, y: CY + y + 18 }, { opacity: 1, y: CY + y, duration: 0.5, ease: 'back.out(1.6)' }, at);
  };
  lab('en', 385, 88, 4.55);
  lab('pt', 545, 192, 4.85);
  lab('es', 845, 136, 5.2);

  // «Esa es tu ventana»: the gap between English taking off and Spanish taking off.
  tl.fromTo('#f10-band', { opacity: 0, scaleX: 0, transformOrigin: '156px 0px' }, { opacity: 1, scaleX: 1, duration: 0.7, ease: 'expo.out' }, 5.1);
  tl.fromTo(['#f10-edge-a', '#f10-edge-b'], { opacity: 0 }, { opacity: 1, duration: 0.35, stagger: 0.12 }, 5.1);
  tl.fromTo(['#f10-dot-en', '#f10-dot-es'], { opacity: 0, scale: 0, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2.4)', stagger: 0.14 }, 5.15);
  tl.fromTo('#f10-brk', { opacity: 0, scaleX: 0, transformOrigin: '160px 590px' }, { opacity: 1, scaleX: 1, duration: 0.6, ease: 'expo.out' }, 5.15);
  tl.set('#f10-win', { x: CX + 384 - 150, y: CY + 612 }, 0);
  tl.fromTo('#f10-win', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.55, ease: 'back.out(2)' }, 5.2);

  // Music: the real case slides in beside the waves (nudge-curve on the chart group), then the
  // kicker and the labeled Wikipedia note. The waves keep breathing.
  tl.fromTo('#f10-case', { x: 300, opacity: 0, filter: 'blur(12px)' }, { x: 0, opacity: 1, filter: 'blur(0px)', duration: 0.8, ease: 'expo.out' }, 6.5);
  K.count(tl, $('#f10-n-en'), { from: 0, to: 13, start: 6.75, duration: 0.9 });
  K.count(tl, $('#f10-n-es'), { from: 0, to: 2, start: 7.0, duration: 0.7 });
  tl.fromTo('#f10-lead', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 7.5);
  tl.fromTo('#f10-kick', { opacity: 0, y: 24, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'back.out(1.8)' }, 8.6);
  tl.fromTo('#f10-note', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 9.4);
  // The window keeps pulsing while the music plays (motion, no new text).
  tl.to('#f10-band', { opacity: 0.55, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: 4 }, 6.4);
  K.drift(tl, '#f10-dot-es', { scale: 1.35, period: 0.9, total: 5.4, at: 6.6 });

  K.exit(tl, '#f10-stage', 12.5);

          window.__timelines['f10-languages'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
