name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests and the backtest gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Parsers run on recorded captures and the model is scripted: no network in tests.
      - run: pnpm test
      # Replays the detector on past AI waves; fails if it misses waves or raises false alarms.
      - name: Backtest gate
        run: pnpm eval
      - run: pnpm build
      # The bundle must start on its own: catches dependencies that only resolve inside the workspace.
      - name: Start the built API
        env:
          DEMO_MODE: 'true'
          LLM_MODE: replay
          PORT: '4199'
          DATA_DIR: ${{ runner.temp }}/radar-data
        run: |
          node apps/api/dist/index.js > api.log 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            curl -sf http://localhost:4199/api/v1/health && break
            sleep 1
          done
          curl -sf http://localhost:4199/api/v1/health || { cat api.log; kill $pid; exit 1; }
          kill $pid
